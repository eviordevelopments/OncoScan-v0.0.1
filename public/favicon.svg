<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left fluid shape - Blue -->
  <path 
    d="M10 30 C10 15, 20 5, 35 10 C45 15, 50 25, 50 40 C50 55, 45 70, 35 75 C25 80, 15 75, 12 65 C8 50, 10 40, 10 30 Z" 
    fill="url(#blueGradient)" 
    filter="url(#glow)"
    opacity="0.9"
  />
  
  <!-- Right fluid shape - Red -->
  <path 
    d="M90 30 C90 15, 80 5, 65 10 C55 15, 50 25, 50 40 C50 55, 55 70, 65 75 C75 80, 85 75, 88 65 C92 50, 90 40, 90 30 Z" 
    fill="url(#redGradient)" 
    filter="url(#glow)"
    opacity="0.9"
  />
  
  <!-- Center connection with subtle glow -->
  <ellipse 
    cx="50" 
    cy="40" 
    rx="6" 
    ry="10" 
    fill="#1E293B" 
    opacity="0.4"
    filter="url(#glow)"
  />
  
  <!-- Highlight accents -->
  <ellipse cx="35" cy="25" rx="3" ry="4" fill="#FFFFFF" opacity="0.3"/>
  <ellipse cx="65" cy="25" rx="3" ry="4" fill="#FFFFFF" opacity="0.3"/>
</svg>